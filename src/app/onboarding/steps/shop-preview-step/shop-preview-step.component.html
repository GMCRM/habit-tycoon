<div class="step-body">
  <div class="step-icon">🛍️</div>
  <h1 class="step-title">The business shop</h1>
  <p class="step-subtitle">
    As your Habit Cash grows, you can unlock bigger business types — each one
    pays more per completion than the last.
  </p>

  <div class="shop-preview-strip" *ngIf="businessTypes.length">
    <div class="shop-preview-item" *ngFor="let type of businessTypes">
      <span class="shop-preview-icon">{{ type.icon }}</span>
      <span class="shop-preview-name">{{ type.name }}</span>
      <span class="shop-preview-cost">${{ type.base_cost | number }}</span>
    </div>
  </div>
</div>

<div class="step-footer">
  <ion-button expand="block" color="primary" class="step-cta" (click)="browseShop()">
    <ion-icon slot="start" name="storefront"></ion-icon>
    Browse the shop
  </ion-button>
  <ion-button expand="block" fill="clear" color="medium" (click)="next.emit()">
    Skip for now
  </ion-button>
</div>
