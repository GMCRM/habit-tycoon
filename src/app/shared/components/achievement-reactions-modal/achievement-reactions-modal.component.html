<ion-header>
  <ion-toolbar>
    <ion-title>Reactions</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="dismiss()">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="reactions-modal-content">
  <div class="reaction-row" *ngFor="let r of reactions">
    <span class="reaction-name">{{ r.reactor_name }}</span>
    <span class="reaction-emoji">{{ r.emoji }}</span>
  </div>
</ion-content>
